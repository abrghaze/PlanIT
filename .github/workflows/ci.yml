name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: planit_test
          POSTGRES_USER: planit
          POSTGRES_PASSWORD: planit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planit -d planit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLANIT_APP_ENV: test
      PLANIT_DEBUG: "false"
      PLANIT_DATABASE_URL: postgresql+asyncpg://planit:planit_test@localhost:5432/planit_test
      PLANIT_ACCESS_TOKEN_SECRET: ci-only-access-secret-with-at-least-32-characters
      PLANIT_REFRESH_TOKEN_PEPPER: ci-only-refresh-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: |
          python -m pip install -e "./backend[dev]"
          python -m pip check
      - name: Static checks
        run: |
          python infra/scripts/validate-release.py
          python -m ruff check backend
          python -m ruff format --check backend
          python -m mypy --config-file backend/pyproject.toml backend/app
      - name: Verify migrations in both directions
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini check
          python -m alembic -c backend/alembic.ini downgrade base
          python -m alembic -c backend/alembic.ini upgrade head
      - name: Tests
        run: python -m pytest backend/tests

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Resolve packages
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Verify formatting
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-pub
      - name: Verify generated code
        working-directory: mobile
        run: |
          dart run build_runner build
          git diff --exit-code
      - name: Test
        working-directory: mobile
        run: flutter test --no-pub
      - name: Compile Android debug app
        working-directory: mobile
        run: flutter build apk --debug --no-pub
      - name: Compile store-mode Android bundle
        working-directory: mobile
        run: flutter build appbundle --release --no-pub --dart-define=PLANIT_API_BASE_URL=https://api.example.com/api/v1

  containers:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        env:
          PLANIT_API_IMAGE: ghcr.io/abrghaze/planit-api:0.10.0
          PLANIT_APP_VERSION: 0.10.0
          PLANIT_DATABASE_URL: postgresql+asyncpg://planit:real-password@database.example:5432/planit
          PLANIT_ALLOWED_ORIGINS: '["https://app.example.com"]'
          PLANIT_ACCESS_TOKEN_SECRET: ci-production-access-secret-with-at-least-32-characters
          PLANIT_REFRESH_TOKEN_PEPPER: ci-production-refresh-secret-with-at-least-32-characters
          PLANIT_S3_REGION: auto
          PLANIT_S3_BUCKET: planit-private
          PLANIT_S3_ACCESS_KEY_ID: ci-private-storage-access-key
          PLANIT_S3_SECRET_ACCESS_KEY: ci-private-storage-secret-key
        run: |
          docker compose -f infra/docker-compose.yml config --quiet
          docker compose -f infra/docker-compose.production.yml config --quiet
      - name: Build and start API with PostgreSQL
        run: docker compose -f infra/docker-compose.yml up --build --wait --wait-timeout 180 api
      - name: Smoke-test live containers
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/ready
      - name: Prove database backup and restore
        run: |
          docker compose -f infra/docker-compose.yml exec -T postgres pg_dump --username=planit --dbname=planit --format=custom --file=/tmp/planit-ci.dump
          docker compose -f infra/docker-compose.yml exec -T postgres createdb --username=planit planit_restore_ci
          docker compose -f infra/docker-compose.yml exec -T postgres pg_restore --username=planit --dbname=planit_restore_ci --exit-on-error --no-owner /tmp/planit-ci.dump
          docker compose -f infra/docker-compose.yml exec -T postgres psql --username=planit --dbname=planit_restore_ci --tuples-only --command "SELECT version_num FROM alembic_version;"
          docker compose -f infra/docker-compose.yml exec -T postgres dropdb --username=planit planit_restore_ci
      - name: Show container logs after failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose -f infra/docker-compose.yml down --volumes
