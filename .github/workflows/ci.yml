name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: planit_test
          POSTGRES_USER: planit
          POSTGRES_PASSWORD: planit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planit -d planit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLANIT_APP_ENV: test
      PLANIT_DEBUG: "false"
      PLANIT_DATABASE_URL: postgresql+asyncpg://planit:planit_test@localhost:5432/planit_test
      PLANIT_ACCESS_TOKEN_SECRET: ci-only-access-secret-with-at-least-32-characters
      PLANIT_REFRESH_TOKEN_PEPPER: ci-only-refresh-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e "./backend[dev]"
      - name: Static checks
        run: |
          python -m ruff check backend
          python -m ruff format --check backend
          python -m mypy backend/app
      - name: Apply migrations from zero
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Tests
        run: python -m pytest backend/tests

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test
