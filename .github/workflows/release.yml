name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: planit_release
          POSTGRES_USER: planit
          POSTGRES_PASSWORD: planit_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planit -d planit_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLANIT_APP_ENV: test
      PLANIT_DEBUG: "false"
      PLANIT_DATABASE_URL: postgresql+asyncpg://planit:planit_release@localhost:5432/planit_release
      PLANIT_ACCESS_TOKEN_SECRET: release-test-access-secret-with-at-least-32-characters
      PLANIT_REFRESH_TOKEN_PEPPER: release-test-refresh-secret-with-at-least-32-characters
      PLANIT_PRODUCTION_API_URL: ${{ secrets.PLANIT_PRODUCTION_API_URL }}
      PLANIT_ANDROID_KEYSTORE_BASE64: ${{ secrets.PLANIT_ANDROID_KEYSTORE_BASE64 }}
      PLANIT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/mobile/android/planit-release.jks
      PLANIT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PLANIT_ANDROID_KEYSTORE_PASSWORD }}
      PLANIT_ANDROID_KEY_ALIAS: ${{ secrets.PLANIT_ANDROID_KEY_ALIAS }}
      PLANIT_ANDROID_KEY_PASSWORD: ${{ secrets.PLANIT_ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate version and protected release inputs
        shell: bash
        run: |
          python infra/scripts/validate-release.py --tag "$GITHUB_REF_NAME"
          missing=0
          for name in \
            PLANIT_PRODUCTION_API_URL \
            PLANIT_ANDROID_KEYSTORE_BASE64 \
            PLANIT_ANDROID_KEYSTORE_PASSWORD \
            PLANIT_ANDROID_KEY_ALIAS \
            PLANIT_ANDROID_KEY_PASSWORD
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured as a repository secret."
              missing=1
            fi
          done
          if [[ "$PLANIT_PRODUCTION_API_URL" != https://*/api/v1 ]]; then
            echo "::error::PLANIT_PRODUCTION_API_URL must be an HTTPS URL ending in /api/v1."
            missing=1
          fi
          exit "$missing"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Verify backend and migrations
        run: |
          python -m pip install -e "./backend[dev]"
          python -m pip check
          python -m ruff check backend
          python -m ruff format --check backend
          python -m mypy --config-file backend/pyproject.toml backend/app
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini check
          python -m pytest backend/tests

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Verify mobile application
        working-directory: mobile
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub
          dart run build_runner build
          git diff --exit-code
          flutter test --no-pub

      - name: Create signed Android App Bundle
        shell: bash
        run: |
          trap 'rm -f "$PLANIT_ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$PLANIT_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$PLANIT_ANDROID_KEYSTORE_PATH"
          chmod 600 "$PLANIT_ANDROID_KEYSTORE_PATH"
          cd mobile
          flutter build appbundle \
            --release \
            --no-pub \
            --dart-define="PLANIT_API_BASE_URL=$PLANIT_PRODUCTION_API_URL"

      - name: Build and smoke-test release API image
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/planit-api"
          docker build \
            --build-arg "PLANIT_BUILD_VERSION=$version" \
            --build-arg "PLANIT_BUILD_REVISION=$GITHUB_SHA" \
            --tag "$image:$version" \
            --tag "$image:sha-${GITHUB_SHA::12}" \
            backend
          docker run --rm --network host \
            -e PLANIT_APP_ENV=test \
            -e PLANIT_DEBUG=false \
            -e PLANIT_DATABASE_URL \
            -e PLANIT_ACCESS_TOKEN_SECRET \
            -e PLANIT_REFRESH_TOKEN_PEPPER \
            "$image:$version" \
            python -m alembic -c alembic.ini upgrade head
          docker run --detach --name planit-release-api --network host \
            --read-only --tmpfs /tmp:size=64m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e PLANIT_APP_ENV=test \
            -e PLANIT_DEBUG=false \
            -e PLANIT_DATABASE_URL \
            -e PLANIT_ACCESS_TOKEN_SECRET \
            -e PLANIT_REFRESH_TOKEN_PEPPER \
            "$image:$version"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/ready; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker logs planit-release-api
              exit 1
            fi
            sleep 2
          done
          docker rm --force planit-release-api

      - name: Publish immutable API images
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/planit-api"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image:${GITHUB_REF_NAME#v}"
          docker push "$image:sha-${GITHUB_SHA::12}"

      - name: Publish GitHub release
        shell: bash
        run: |
          artifact="mobile/build/app/outputs/bundle/release/app-release.aab"
          checksum="$artifact.sha256"
          sha256sum "$artifact" > "$checksum"
          gh release create "$GITHUB_REF_NAME" \
            "$artifact#PlanIT-${GITHUB_REF_NAME#v}.aab" \
            "$checksum#PlanIT-${GITHUB_REF_NAME#v}.aab.sha256" \
            --verify-tag \
            --generate-notes \
            --title "PlanIT ${GITHUB_REF_NAME#v}"
